syntax = "proto3";

package jsonparserperf.protobufdatamodels;

option csharp_namespace = "JsonParserPerf.ProtobufDataModels";

// A plain record list, the shape most APIs return: for comparing JSON through this parser against the same
// records as binary protobuf through Google's parser.
message Customer {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
  int32 age = 5;
  double balance = 6;
  bool active = 7;
  repeated string tags = 8;
}

message CustomerList {
  repeated Customer customers = 1;
}
