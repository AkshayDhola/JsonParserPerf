syntax = "proto3";

package jsonparserperf.protobufdatamodels;

option csharp_namespace = "JsonParserPerf.ProtobufDataModels";

import "enum_types.proto";
import "message_types.proto";

// Every protobuf type that is legal as a map key.
message MapKeyTypes {
  map<int32, string> int32_key_map = 1;
  map<int64, string> int64_key_map = 2;
  map<uint32, string> uint32_key_map = 3;
  map<uint64, string> uint64_key_map = 4;
  map<sint32, string> sint32_key_map = 5;
  map<sint64, string> sint64_key_map = 6;
  map<fixed32, string> fixed32_key_map = 7;
  map<fixed64, string> fixed64_key_map = 8;
  map<sfixed32, string> sfixed32_key_map = 9;
  map<sfixed64, string> sfixed64_key_map = 10;
  map<bool, string> bool_key_map = 11;
  map<string, string> string_key_map = 12;
}

// Every protobuf type used as a map value.
message MapValueTypes {
  map<string, double> double_value_map = 1;
  map<string, float> float_value_map = 2;
  map<string, int32> int32_value_map = 3;
  map<string, int64> int64_value_map = 4;
  map<string, uint32> uint32_value_map = 5;
  map<string, uint64> uint64_value_map = 6;
  map<string, sint32> sint32_value_map = 7;
  map<string, sint64> sint64_value_map = 8;
  map<string, fixed32> fixed32_value_map = 9;
  map<string, fixed64> fixed64_value_map = 10;
  map<string, sfixed32> sfixed32_value_map = 11;
  map<string, sfixed64> sfixed64_value_map = 12;
  map<string, bool> bool_value_map = 13;
  map<string, string> string_value_map = 14;
  map<string, bytes> bytes_value_map = 15;
  map<string, TopLevelEnum> enum_value_map = 16;
  map<string, LeafMessage> message_value_map = 17;
}
